version: 1
entryState: intake
terminalStates: []

states:
  intake:
    type: interactive
    skill: intake
    next:
      - exploration
      - trivial
      - brainstorming
    silent_stop_allowed: true

  exploration:
    type: interactive
    skill: exploration
    next:
      - intake
    silent_stop_allowed: true

  trivial:
    type: execution
    skill: trivial
    next:
      - intake
      - systematic_debugging
    silent_stop_allowed: false

  brainstorming:
    type: interactive
    skill: brainstorming
    next:
      - planning
    silent_stop_allowed: true

  planning:
    type: interactive
    skill: planning
    next:
      - serial_execution
      - parallel_execution
    silent_stop_allowed: true

  serial_execution:
    type: execution
    skill: serial-execution
    next:
      - verification
      - systematic_debugging
    silent_stop_allowed: false

  parallel_execution:
    type: execution
    skill: parallel-execution
    next:
      - verification
      - systematic_debugging
    silent_stop_allowed: false

  verification:
    type: gate
    skill: verification
    next:
      - finishing
      - systematic_debugging
    silent_stop_allowed: true

  finishing:
    type: gate
    skill: finishing
    next:
      - intake
      - systematic_debugging
    silent_stop_allowed: false

  systematic_debugging:
    type: preemptive
    skill: systematic-debugging
    next:
      - previous_state
      - serial_execution
      - planning
    silent_stop_allowed: true
