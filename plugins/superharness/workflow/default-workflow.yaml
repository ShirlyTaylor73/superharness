version: 1
entryState: intake
terminalStates: []

states:
  intake:
    type: interactive
    skill: intake
    next:
      - exploration
      - trivial
      - brainstorming

  exploration:
    type: interactive
    skill: exploration
    next:
      - intake

  trivial:
    type: execution
    skill: trivial
    next:
      - intake
      - systematic_debugging

  brainstorming:
    type: interactive
    skill: brainstorming
    next:
      - planning

  planning:
    type: interactive
    skill: planning
    next:
      - serial_execution
      - parallel_execution

  serial_execution:
    type: execution
    skill: serial-execution
    next:
      - verification
      - systematic_debugging

  parallel_execution:
    type: execution
    skill: parallel-execution
    next:
      - verification
      - systematic_debugging

  verification:
    type: gate
    skill: verification
    next:
      - finishing
      - systematic_debugging

  finishing:
    type: gate
    skill: finishing
    next:
      - intake
      - systematic_debugging

  systematic_debugging:
    type: preemptive
    skill: systematic-debugging
    next:
      - previous_state
      - serial_execution
      - planning
