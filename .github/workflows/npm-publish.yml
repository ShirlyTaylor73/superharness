name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedTag = `v${pkg.version}`;
          const actualTag = process.env.GITHUB_REF_NAME;
          if (actualTag !== expectedTag) {
            console.error(`Tag ${actualTag} does not match package version ${pkg.version}; expected ${expectedTag}`);
            process.exit(1);
          }
          console.log(`Publishing ${pkg.name}@${pkg.version} from ${actualTag}`);
          NODE

      - name: Run installer tests
        run: npm run test:installer

      - name: Preview npm package
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance --access public
